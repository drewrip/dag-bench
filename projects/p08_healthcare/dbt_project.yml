name: 'p08_healthcare'
version: '1.0.0'
config-version: 2
profile: 'p08_healthcare'
model-paths: ["models"]
# ../../macros: shared Snowflake portability macros
macro-paths: ["macros", "../../macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
# Renders only on the snowflake target (statement timeouts); empty elsewhere.
on-run-start:
  - "{{ dagbench_sf_session() }}"

models:
  +pre-hook: "{{ dagbench_sf_session() }}"
  p08_healthcare:
    layer_1:
      +materialized: view
    layer_2:
      +materialized: view
    layer_3:
      +materialized: view
    layer_4:
      +materialized: view
    layer_5:
      +materialized: view
    layer_6:
      +materialized: view
    layer_7:
      +materialized: table
