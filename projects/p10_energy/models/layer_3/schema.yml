version: 2

models:
  - name: substation_load
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [sub_id, read_day]
      - quality_baseline:
          not_null_columns: [sub_id, region, read_day, active_meters, total_kwh, peak_meter_kwh, avg_voltage, avg_pf]
          range_checks:
            - {column: active_meters, min: 0}
            - {column: total_kwh, min: 0}
            - {column: peak_meter_kwh, min: 0}
    columns:
      - name: region
        tests:
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']

  - name: tariff_profile
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region, meter_type, tariff_class]
      - quality_baseline:
          not_null_columns: [region, meter_type, tariff_class, meters, avg_daily_kwh, total_kwh, avg_pf]
          range_checks:
            - {column: meters, min: 0}
            - {column: avg_daily_kwh, min: 0}
            - {column: total_kwh, min: 0}
    columns:
      - name: region
        tests:
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']
      - name: meter_type
        tests:
          - accepted_values:
              values: ['residential', 'commercial', 'industrial']
      - name: tariff_class
        tests:
          - accepted_values:
              values: ['residential_standard', 'residential_tou', 'commercial_standard', 'commercial_demand', 'industrial_demand']

  - name: voltage_anomalies
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [meter_id, read_hour]
      - quality_baseline:
          not_null_columns: [meter_id, read_hour, avg_voltage, mean_v, std_v, z_score, is_anomaly]
          range_checks:
            - {column: z_score, min: 0}
