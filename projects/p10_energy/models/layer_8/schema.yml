version: 2

models:
  - name: rpt_grid_kpis
    tests:
      - unique:
          column_name: region
      - quality_baseline:
          not_null_columns: [region, total_kwh, avg_pf, total_outages, total_cml, latest_month_kwh, report_ts]
          range_checks:
            - {column: total_kwh, min: 0}
            - {column: avg_pf, min: 0, max: 1}
            - {column: total_outages, min: 0}
            - {column: total_cml, min: 0}
            - {column: latest_month_kwh, min: 0}
    columns:
      - name: region
        tests:
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']

  - name: rpt_outage_impact
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region, cause, severity]
      - quality_baseline:
          not_null_columns: [region, cause, severity, outages, total_min, total_cml, avg_hrs, major_outages, cml_share_pct, report_ts]
          range_checks:
            - {column: outages, min: 0}
            - {column: total_min, min: 0}
            - {column: total_cml, min: 0}
            - {column: avg_hrs, min: 0}
            - {column: major_outages, min: 0}
            - {column: cml_share_pct, min: 0, max: 100}
    columns:
      - name: region
        tests:
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']
      - name: cause
        tests:
          - accepted_values:
              values: ['weather', 'equipment_failure', 'vegetation', 'vehicle_accident', 'animal_contact', 'planned_maintenance', 'cyberattack']
      - name: severity
        tests:
          - accepted_values:
              values: ['minor', 'moderate', 'major', 'critical']

  - name: rpt_regional_energy
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region, tariff_class]
      - quality_baseline:
          not_null_columns: [region, tariff_class, total_kwh, avg_pf, total_outages, total_cml, avg_daily_kwh, voltage_anomalies, report_ts]
          range_checks:
            - {column: total_kwh, min: 0}
            - {column: avg_pf, min: 0, max: 1}
            - {column: total_outages, min: 0}
            - {column: total_cml, min: 0}
            - {column: avg_daily_kwh, min: 0}
            - {column: voltage_anomalies, min: 0}
    columns:
      - name: region
        tests:
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']
      - name: tariff_class
        tests:
          - accepted_values:
              values: ['residential_standard', 'residential_tou', 'commercial_standard', 'commercial_demand', 'industrial_demand']

  - name: rpt_substation_reliability
    tests:
      - unique:
          column_name: sub_id
      - quality_baseline:
          not_null_columns: [sub_id, sub_name, region, capacity_mw, period_kwh, avg_pf, outages, total_cml, days_with_data, kwh_per_mw, report_ts]
          range_checks:
            - {column: capacity_mw, min: 0, max: 500}
            - {column: period_kwh, min: 0}
            - {column: avg_pf, min: 0, max: 1}
            - {column: outages, min: 0}
            - {column: total_cml, min: 0}
            - {column: days_with_data, min: 0}
            - {column: kwh_per_mw, min: 0}
    columns:
      - name: region
        tests:
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']

  - name: rpt_tariff_consumption
    tests:
      - quality_baseline:
          not_null_columns: [tariff_class, meter_type, meters, avg_daily_kwh, total_kwh, avg_pf, type_share_pct, report_ts]
          range_checks:
            - {column: meters, min: 0}
            - {column: avg_daily_kwh, min: 0}
            - {column: total_kwh, min: 0}
            - {column: type_share_pct, min: 0, max: 100}
    columns:
      - name: tariff_class
        tests:
          - accepted_values:
              values: ['residential_standard', 'residential_tou', 'commercial_standard', 'commercial_demand', 'industrial_demand']
      - name: meter_type
        tests:
          - accepted_values:
              values: ['residential', 'commercial', 'industrial']

  - name: rpt_voltage_anomalies
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [region, anomaly_date]
      - quality_baseline:
          not_null_columns: [region, anomaly_date, anomalies, affected_meters, avg_z, cumulative_anomalies, report_ts]
          range_checks:
            - {column: anomalies, min: 0}
            - {column: affected_meters, min: 0}
            - {column: avg_z, min: 0}
            - {column: cumulative_anomalies, min: 0}
    columns:
      - name: region
        tests:
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']
