m01_bad_view_mat:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "data/warehouse.duckdb"
      threads: 16
    postgres:
      type: postgres
      host: "{{ env_var('DAGBENCH_PG_HOST', '0.0.0.0') }}"
      user: runner
      password: password
      port: "{{ env_var('DAGBENCH_PG_PORT', '5432') | as_number }}"
      dbname: benchmark
      schema: micro_m01_bad_view_mat
      threads: 16
    # Reference DuckDB build over the tiny input for the Snowflake comparison
    # (utils/snowflake_tiny.py). Same file name as dev, so compiled SQL matches.
    duckdb_tiny:
      type: duckdb
      path: "data/tiny/warehouse.duckdb"
      threads: 16
    # Logic checks only, over tiny data. Run every command through
    # `python -m utils.snowflake_budget run -- ...`; that is the
    # only thing that sets DAGBENCH_SF_PRIVATE_KEY_PATH (key-pair auth, a path)
    # or DAGBENCH_SF_TOKEN (the PAT). Whichever is unset stays empty.
    snowflake:
      type: snowflake
      account: "{{ env_var('DAGBENCH_SF_ACCOUNT', 'FY02423-GP21411') }}"
      user: "{{ env_var('DAGBENCH_SF_USER', 'DREWRIPBERGER') }}"
      private_key_path: "{{ env_var('DAGBENCH_SF_PRIVATE_KEY_PATH', '') }}"
      password: "{{ env_var('DAGBENCH_SF_TOKEN', '') }}"
      role: "{{ env_var('DAGBENCH_SF_ROLE', 'CMUADMIN') }}"
      warehouse: "{{ env_var('DAGBENCH_SF_WAREHOUSE', 'CMU_ROBOTS') }}"
      database: CMU
      schema: DAGBENCH_M01_BAD_VIEW_MAT
      threads: 4
      query_tag: dagbench
      reuse_connections: true
      client_session_keep_alive: false
      connect_timeout: 60
