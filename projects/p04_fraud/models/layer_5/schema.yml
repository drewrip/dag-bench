version: 2

models:
  - name: fraud_trend
    tests:
      - not_empty
      - unique:
          column_name: txn_day
    columns:
      - name: txn_day
        tests:
          - dbt_utils.at_least_one
      - name: daily_flagged
        tests:
          - dbt_utils.at_least_one
      - name: daily_confirmed
        tests:
          - dbt_utils.at_least_one
      - name: daily_volume
        tests:
          - dbt_utils.at_least_one
      - name: prev_day_flagged
        tests:
          - dbt_utils.at_least_one
      - name: cumulative_fraud
        tests:
          - dbt_utils.at_least_one

  - name: high_risk_accounts
    tests:
      - not_empty
      - unique:
          column_name: account_id
    columns:
      - name: account_id
        tests:
          - dbt_utils.at_least_one
      - name: account_country
        tests:
          - dbt_utils.at_least_one
      - name: risk_band
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['HIGH']
      - name: risk_score
        tests:
          - dbt_utils.at_least_one
      - name: flag_rate_pct
        tests:
          - dbt_utils.at_least_one
      - name: total_spend
        tests:
          - dbt_utils.at_least_one
      - name: total_txns
        tests:
          - dbt_utils.at_least_one

  - name: merchant_risk_rank
    tests:
      - not_empty
      - unique:
          column_name: merchant_id
      - dbt_utils.accepted_range:
          column_name: risk_quartile
          min_value: 1
          max_value: 4
    columns:
      - name: merchant_id
        tests:
          - dbt_utils.at_least_one
      - name: merchant_name
        tests:
          - dbt_utils.at_least_one
      - name: merchant_category
        tests:
          - dbt_utils.at_least_one
      - name: risk_tier
        tests:
          - dbt_utils.at_least_one
      - name: total_txns
        tests:
          - dbt_utils.at_least_one
      - name: total_volume
        tests:
          - dbt_utils.at_least_one
      - name: flagged_txns
        tests:
          - dbt_utils.at_least_one
      - name: flag_rate_pct
        tests:
          - dbt_utils.at_least_one
      - name: avg_txn
        tests:
          - dbt_utils.at_least_one
      - name: max_txn
        tests:
          - dbt_utils.at_least_one
      - name: rank_in_cat
        tests:
          - dbt_utils.at_least_one
      - name: risk_quartile
        tests:
          - dbt_utils.at_least_one
