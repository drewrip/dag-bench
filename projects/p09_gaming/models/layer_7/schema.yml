version: 2

models:
  - name: rpt_country_kpis
    tests:
      - not_empty
      - unique:
          column_name: country
    columns:
      - name: country
        tests:
          - dbt_utils.at_least_one
      - name: players
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: total_revenue
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: arpu
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: avg_active_days
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: paying
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: conversion_pct
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: revenue_rank
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 1
      - name: report_ts
        tests:
          - dbt_utils.at_least_one

  - name: rpt_monetization_segments
    tests:
      - not_empty
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [monetization_tier, engagement_tier]
    columns:
      - name: monetization_tier
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['Whale','Dolphin','Minnow','Free']
      - name: engagement_tier
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['Power','Regular','Casual','Churned']
      - name: players
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: revenue
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: revenue_share_pct
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: avg_sessions
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: avg_active_days
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: report_ts
        tests:
          - dbt_utils.at_least_one

  - name: rpt_platform_summary
    tests:
      - not_empty
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [platform, monetization_tier]
    columns:
      - name: platform
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['android','ios','steam','playstation','xbox','nintendo_switch']
      - name: monetization_tier
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['Whale','Dolphin','Minnow','Free']
      - name: players
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: revenue
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: avg_active_days
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: avg_cr
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: tier_revenue_share
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: report_ts
        tests:
          - dbt_utils.at_least_one

  - name: rpt_world_performance
    tests:
      - not_empty
      - unique:
          column_name: world
    columns:
      - name: world
        tests:
          - dbt_utils.at_least_one
      - name: completions
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: failures
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: avg_cr
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: level_count
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: global_cr
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: difficulty_rank
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 1
      - name: report_ts
        tests:
          - dbt_utils.at_least_one
