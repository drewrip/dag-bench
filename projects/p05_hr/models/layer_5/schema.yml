version: 2

models:
  - name: dept_risk_summary
    tests:
      - not_empty
      - unique:
          column_name: dept_name
    columns:
      - name: dept_name
        tests:
          - dbt_utils.at_least_one
      - name: employees
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: high_risk
        tests:
          - dbt_utils.at_least_one
      - name: medium_risk
        tests:
          - dbt_utils.at_least_one
      - name: avg_risk_score
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 8

  - name: gender_pay_gaps
    tests:
      - not_empty
      - unique:
          column_name: dept_name
    columns:
      - name: dept_name
        tests:
          - dbt_utils.at_least_one
      - name: female_avg
        tests:
          - dbt_utils.at_least_one
      - name: male_avg
        tests:
          - dbt_utils.at_least_one
      - name: f_m_ratio
        tests:
          - dbt_utils.at_least_one

  - name: top_earners
    tests:
      - not_empty
      - unique:
          column_name: emp_id
    columns:
      - name: emp_id
        tests:
          - dbt_utils.at_least_one
      - name: full_name
        tests:
          - dbt_utils.at_least_one
      - name: dept_name
        tests:
          - dbt_utils.at_least_one
      - name: division
        tests:
          - dbt_utils.at_least_one
      - name: total_comp
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
      - name: avg_perf_score
        tests:
          - dbt_utils.at_least_one
      - name: tenure_years
        tests:
          - dbt_utils.at_least_one
      - name: rank_in_division
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 1
