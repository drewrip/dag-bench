version: 2

models:
  - name: reorder_alerts
    tests:
      - not_empty
    columns:
      - name: sku
        tests:
          - dbt_utils.at_least_one
      - name: wh_id
        tests:
          - dbt_utils.at_least_one
      - name: wh_name
        tests:
          - dbt_utils.at_least_one
      - name: region
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']
      - name: qty_on_hand
        tests:
          - dbt_utils.at_least_one
      - name: qty_available
        tests:
          - dbt_utils.at_least_one
      - name: reorder_point
        tests:
          - dbt_utils.at_least_one
      - name: gap
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: suggested_order_qty
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: supplier_scorecard
    tests:
      - not_empty
      - unique:
          column_name: supplier_id
    columns:
      - name: supplier_id
        tests:
          - dbt_utils.at_least_one
      - name: supplier_name
        tests:
          - dbt_utils.at_least_one
      - name: category
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['electronics_components', 'packaging', 'raw_materials', 'hardware', 'textiles', 'food_ingredients']
      - name: is_preferred
        tests:
          - dbt_utils.at_least_one
      - name: delivery_rate
        tests:
          - dbt_utils.at_least_one
      - name: avg_transit
        tests:
          - dbt_utils.at_least_one
      - name: total_cargo_value
        tests:
          - dbt_utils.at_least_one
      - name: avg_fill_rate
        tests:
          - dbt_utils.at_least_one
      - name: avg_lead
        tests:
          - dbt_utils.at_least_one
      - name: score
        tests:
          - dbt_utils.at_least_one
      - name: overall_rank
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true
