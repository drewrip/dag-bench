version: 2

models:
  - name: stg_inventory
    tests:
      - not_empty
      - unique:
          column_name: inv_id
    columns:
      - name: inv_id
        tests:
          - dbt_utils.at_least_one
      - name: wh_id
        tests:
          - dbt_utils.at_least_one
      - name: sku
        tests:
          - dbt_utils.at_least_one
      - name: qty_on_hand
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 10000
              inclusive: true
      - name: qty_reserved
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 500
              inclusive: true
      - name: qty_available
        tests:
          - dbt_utils.at_least_one
      - name: reorder_point
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 100
              max_value: 1000
              inclusive: true
      - name: snapshot_date
        tests:
          - dbt_utils.at_least_one
      - name: needs_reorder
        tests:
          - dbt_utils.at_least_one

  - name: stg_pos
    tests:
      - not_empty
      - unique:
          column_name: po_id
    columns:
      - name: po_id
        tests:
          - dbt_utils.at_least_one
      - name: supplier_id
        tests:
          - dbt_utils.at_least_one
      - name: sku
        tests:
          - dbt_utils.at_least_one
      - name: ordered_qty
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 100
              max_value: 5000
              inclusive: true
      - name: unit_price
        tests:
          - dbt_utils.at_least_one
      - name: order_date
        tests:
          - dbt_utils.at_least_one
      - name: expected_date
        tests:
          - dbt_utils.at_least_one
      - name: received_qty
        tests:
          - dbt_utils.at_least_one
      - name: status
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['received', 'approved', 'partially_received', 'submitted', 'draft', 'cancelled']
      - name: received_value
        tests:
          - dbt_utils.at_least_one
      - name: ordered_value
        tests:
          - dbt_utils.at_least_one
      - name: promised_lead
        tests:
          - dbt_utils.at_least_one

  - name: stg_shipments
    tests:
      - not_empty
      - unique:
          column_name: shipment_id
    columns:
      - name: shipment_id
        tests:
          - dbt_utils.at_least_one
      - name: supplier_id
        tests:
          - dbt_utils.at_least_one
      - name: wh_id
        tests:
          - dbt_utils.at_least_one
      - name: sku
        tests:
          - dbt_utils.at_least_one
      - name: quantity
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 10
              max_value: 10000
              inclusive: true
      - name: unit_cost
        tests:
          - dbt_utils.at_least_one
      - name: shipped_date
        tests:
          - dbt_utils.at_least_one
      - name: received_date
        tests:
          - dbt_utils.at_least_one
      - name: status
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['delivered', 'in_transit', 'delayed', 'customs_hold', 'cancelled']
      - name: freight_cost
        tests:
          - dbt_utils.at_least_one
      - name: cargo_value
        tests:
          - dbt_utils.at_least_one
      - name: transit_days
        tests:
          - dbt_utils.at_least_one
      - name: is_delivered
        tests:
          - dbt_utils.at_least_one
      - name: is_problematic
        tests:
          - dbt_utils.at_least_one

  - name: stg_suppliers
    tests:
      - not_empty
      - unique:
          column_name: supplier_id
    columns:
      - name: supplier_id
        tests:
          - dbt_utils.at_least_one
      - name: supplier_name
        tests:
          - dbt_utils.at_least_one
      - name: country
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['CN', 'US', 'VN', 'MX', 'DE', 'IN', 'BR', 'ID', 'PL', 'TH', 'KR', 'IT']
      - name: reliability_score
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0.5
              max_value: 1.0
              inclusive: true
      - name: lead_time_days
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 3
              max_value: 60
              inclusive: true
      - name: category
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['electronics_components', 'packaging', 'raw_materials', 'hardware', 'textiles', 'food_ingredients']
      - name: is_preferred
        tests:
          - dbt_utils.at_least_one

  - name: stg_warehouses
    tests:
      - not_empty
      - unique:
          column_name: wh_id
    columns:
      - name: wh_id
        tests:
          - dbt_utils.at_least_one
      - name: wh_name
        tests:
          - dbt_utils.at_least_one
      - name: country
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['US', 'DE', 'SG', 'BR', 'AU']
      - name: region
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']
      - name: capacity_m3
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 1000
              max_value: 50000
              inclusive: true
      - name: is_active
        tests:
          - dbt_utils.at_least_one
