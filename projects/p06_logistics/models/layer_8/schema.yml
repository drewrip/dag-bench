version: 2

models:
  - name: rpt_region_inventory
    tests:
      - not_empty
      - unique:
          column_name: region
    columns:
      - name: region
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']
      - name: inventory
        tests:
          - dbt_utils.at_least_one
      - name: available
        tests:
          - dbt_utils.at_least_one
      - name: reorder_alerts
        tests:
          - dbt_utils.at_least_one
      - name: avg_utilization
        tests:
          - dbt_utils.at_least_one
      - name: availability_pct
        tests:
          - dbt_utils.at_least_one
      - name: report_ts
        tests:
          - dbt_utils.at_least_one

  - name: rpt_reorder_alerts
    tests:
      - not_empty
    columns:
      - name: sku
        tests:
          - dbt_utils.at_least_one
      - name: wh_id
        tests:
          - dbt_utils.at_least_one
      - name: wh_name
        tests:
          - dbt_utils.at_least_one
      - name: region
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['north_america', 'europe', 'apac', 'latin_america']
      - name: qty_on_hand
        tests:
          - dbt_utils.at_least_one
      - name: qty_available
        tests:
          - dbt_utils.at_least_one
      - name: reorder_point
        tests:
          - dbt_utils.at_least_one
      - name: gap
        tests:
          - dbt_utils.at_least_one
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: suggested_order_qty
        tests:
          - dbt_utils.at_least_one
      - name: report_ts
        tests:
          - dbt_utils.at_least_one

  - name: rpt_supplier_scorecard
    tests:
      - not_empty
      - unique:
          column_name: supplier_id
    columns:
      - name: supplier_id
        tests:
          - dbt_utils.at_least_one
      - name: supplier_name
        tests:
          - dbt_utils.at_least_one
      - name: category
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['electronics_components', 'packaging', 'raw_materials', 'hardware', 'textiles', 'food_ingredients']
      - name: score
        tests:
          - dbt_utils.at_least_one
      - name: overall_rank
        tests:
          - dbt_utils.at_least_one
      - name: delivery_rate
        tests:
          - dbt_utils.at_least_one
      - name: avg_fill_rate
        tests:
          - dbt_utils.at_least_one
      - name: is_preferred
        tests:
          - dbt_utils.at_least_one
      - name: report_ts
        tests:
          - dbt_utils.at_least_one

  - name: rpt_supply_risk
    tests:
      - not_empty
      - unique:
          column_name: category
    columns:
      - name: category
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['electronics_components', 'packaging', 'raw_materials', 'hardware', 'textiles', 'food_ingredients']
      - name: risk_status
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['SUPPLIER_RISK', 'INVENTORY_RISK', 'NORMAL']
      - name: avg_score
        tests:
          - dbt_utils.at_least_one
      - name: suppliers
        tests:
          - dbt_utils.at_least_one
      - name: reorder_alerts
        tests:
          - dbt_utils.at_least_one
      - name: report_ts
        tests:
          - dbt_utils.at_least_one

  - name: rpt_top_suppliers_by_cat
    tests:
      - not_empty
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [category, supplier_name]
    columns:
      - name: category
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['electronics_components', 'packaging', 'raw_materials', 'hardware', 'textiles', 'food_ingredients']
      - name: supplier_name
        tests:
          - dbt_utils.at_least_one
      - name: score
        tests:
          - dbt_utils.at_least_one
      - name: delivery_rate
        tests:
          - dbt_utils.at_least_one
      - name: avg_fill_rate
        tests:
          - dbt_utils.at_least_one
      - name: risk_status
        tests:
          - dbt_utils.at_least_one
          - accepted_values:
              values: ['SUPPLIER_RISK', 'INVENTORY_RISK', 'NORMAL']
      - name: report_ts
        tests:
          - dbt_utils.at_least_one
