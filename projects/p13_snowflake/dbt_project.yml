# data-eng-bench base retail project vendored by utils/retail_vendor.py; see VENDORED.md.
name: 'p13_snowflake'
version: '1.0.0'
config-version: 2
require-dbt-version: [">=1.10.0", "<3.0.0"]
profile: 'p13_snowflake'

model-paths: ["models"]
macro-paths: ["macros", "../../macros"]  # ../../macros: shared Snowflake portability macros
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Upstream's intended defaults. Upstream keys them under `retail_warehouse`,
# which isn't the project name, so they never applied there (everything
# without an inline config was a view). Upstream's `+schema` per layer is
# dropped: every relation lives in the target schema.
# Renders only on the snowflake target (statement timeouts, UTC); empty elsewhere.
on-run-start:
  - "{{ dagbench_sf_session() }}"

models:
  +pre-hook: "{{ dagbench_sf_session() }}"
  p13_snowflake:
    staging:
      +materialized: view
      analytics:
        # dag-bench: upstream's stray "stg_dim_geography(1)" copy (read by
        # nothing). dbt-snowflake doesn't quote relation names, so it is renamed
        # there; DuckDB and Postgres keep the name (they quote it).
        "stg_dim_geography(1)":
          +alias: "{{ 'stg_dim_geography_1' if target.type == 'snowflake' else 'stg_dim_geography(1)' }}"
    intermediate:
      +materialized: view
    marts:
      +materialized: table

vars:
  # dag-bench: "now" for upstream's current_date / current_timestamp (see
  # macros/dagbench/portability.sql): the day after the data's last order.
  dagbench_as_of_date: '2026-01-08'

  # Snowflake leaf diff only (utils/compare_snowflake.py; not referenced by any
  # model). "Now" is pinned, so no column is volatile (created_at is data
  # here). The ties listed in VENDORED.md make these results undefined: only
  # their row counts are compared.
  dagbench_volatile_columns: []
  dagbench_nondeterministic_models: [stg_vbap, stg_order_lines, stg_trans_lines, dim_trans_lines,
                                     rpt_customer_loyalty_balance, rpt_campaign_roi_analysis,
                                     # Found by the diff, same kind: row_number() / ntile() over
                                     # orderings with ties (equal timestamps, counts, totals).
                                     rpt_customer_lifecycle_event_sequence, fct_shipment_tracking,
                                     rpt_rfm_analysis, int_customers_sarah_experiment,
                                     rpt_product_affinity_analysis]
  # Row count differs even between two DuckDB runs (VENDORED.md): columns only.
  dagbench_unstable_models: [rpt_cannibalization_analysis]

  # Upstream vars, unchanged.
  # Date range for historical data
  start_date: '2020-01-01'
  end_date: '2024-12-31'

  # Customer segmentation thresholds
  # Value segments (based on lifetime_value)
  customer_value_vip_threshold: 10000
  customer_value_high_threshold: 5000
  customer_value_medium_threshold: 1000

  # Order count segments
  customer_orders_loyal_threshold: 10
  customer_orders_regular_threshold: 5
  customer_orders_occasional_threshold: 1

  # LTV calculation parameters
  # WARNING: predicted_ltv multiplier is a placeholder - see int_customers__lifetime_metrics.sql
  ltv_prediction_multiplier: 2.0

  # Data quality thresholds
  dq_max_duplicate_rate: 0.01  # 1% max duplicates
  dq_max_null_rate: 0.05       # 5% max nulls in key fields
